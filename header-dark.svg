<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 1000 172" width="1000" height="172" role="img" aria-label="Darshan Chougule — AI/ML Engineer">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fg { fill: #e6edf3; }
    .muted { fill: #7d8590; }
    .accent { fill: #3fb950; }
    .node rect { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .node text { fill: #e6edf3; }
    .wire { stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 4 4; }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }

    .packet { animation: travel 3.6s linear infinite; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(360px); } }

    .node rect { animation: pulse 3.6s ease-in-out infinite; }
    .n2 rect { animation-delay: .9s; }
    .n3 rect { animation-delay: 1.8s; }
    .n4 rect { animation-delay: 2.7s; }
    @keyframes pulse { 0%, 25%, 100% { stroke: #30363d; } 10% { stroke: #3fb950; } }

    @media (prefers-color-scheme: light) {
      .fg, .node text { fill: #1f2328; }
      .muted { fill: #59636e; }
      .accent { fill: #1a7f37; }
      .node rect { fill: #f6f8fa; stroke: #d1d9e0; }
      .wire { stroke: #d1d9e0; }
      @keyframes pulse { 0%, 25%, 100% { stroke: #d1d9e0; } 10% { stroke: #1a7f37; } }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .packet, .node rect { animation: none; }
    }
  </style>

  <!-- Intro -->
  <text class="mono muted" x="0" y="42" font-size="15">~/darshan $ whoami</text>
  <text class="sans fg" x="0" y="100" font-size="48" font-weight="700" letter-spacing="-1">Darshan Chougule</text>
  <text class="mono fg" x="0" y="140" font-size="17">AI/ML Engineer — GenAI, machine learning &amp; automation<tspan class="accent cursor"> ▍</tspan></text>
  <circle class="accent" cx="5" cy="181" r="4"/>
  <text class="mono muted" x="18" y="186" font-size="14">Open to AI/ML &amp; Gen-AI roles · ACM WCE Hackathon Top 6</text>

  <!-- Pipeline: data → train → generate → automate -->
  <text class="mono muted" x="640" y="70" font-size="13">pipeline.run()</text>
  <line class="wire" x1="640" y1="118" x2="1000" y2="118"/>
  <circle class="accent packet" cx="640" cy="118" r="4"/>

  <g class="node n1"><rect x="640" y="96" width="78" height="44" rx="8"/><text class="mono" x="679" y="123" font-size="13" text-anchor="middle">data</text></g>
  <g class="node n2"><rect x="734" y="96" width="78" height="44" rx="8"/><text class="mono" x="773" y="123" font-size="13" text-anchor="middle">train</text></g>
  <g class="node n3"><rect x="828" y="96" width="78" height="44" rx="8"/><text class="mono" x="867" y="123" font-size="13" text-anchor="middle">generate</text></g>
  <g class="node n4"><rect x="922" y="96" width="78" height="44" rx="8"/><text class="mono" x="961" y="123" font-size="13" text-anchor="middle">automate</text></g>

  <text class="mono muted" x="773" y="166" font-size="12" text-anchor="middle">ML</text>
  <text class="mono muted" x="867" y="166" font-size="12" text-anchor="middle">GenAI</text>
  <text class="mono muted" x="961" y="166" font-size="12" text-anchor="middle">workflows</text>
</svg>
